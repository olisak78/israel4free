<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before first paint so dark mode never flashes
         light (and the correct logo renders immediately). Mirrors the key and
         default used by ThemeProvider; defaults to light when unset/invalid. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('i4f.theme')
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO metadata. English is the default/x-default language; the app
         updates <title>, description and og:locale client-side when the user
         switches to Hebrew (see src/i18n/LanguageContext.tsx). -->
    <title>Israel Open Data Portal — Vehicles, Flights, ATMs &amp; More | Israel4Free</title>
    <meta
      name="description"
      content="Search Israeli vehicle licenses, flights, ATMs, pharmacies and public transit in one fast, clean interface over Israel's open government data. Free, no sign-up."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://israel4free.com/" />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Israel4Free" />
    <meta property="og:title" content="Israel Open Data Portal — Vehicles, Flights, ATMs &amp; More" />
    <meta
      property="og:description"
      content="Search Israeli vehicle licenses, flights, ATMs, pharmacies and public transit over Israel's open government data. Free, no sign-up."
    />
    <meta property="og:url" content="https://israel4free.com/" />
    <meta property="og:image" content="https://israel4free.com/favicon.png" />
    <meta property="og:image:width" content="1312" />
    <meta property="og:image:height" content="1199" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Israel Open Data Portal | Israel4Free" />
    <meta
      name="twitter:description"
      content="Search Israeli vehicle licenses, flights, ATMs, pharmacies and public transit over Israel's open government data."
    />
    <meta name="twitter:image" content="https://israel4free.com/favicon.png" />

    <!-- Structured data: the real site + publishing organization. No SearchAction
         (site search is not yet a working query endpoint) and no invented
         ratings, social profiles, or organizational claims. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://israel4free.com/#organization",
            "name": "Israel4Free",
            "url": "https://israel4free.com/",
            "logo": "https://israel4free.com/favicon.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://israel4free.com/#website",
            "name": "Israel4Free",
            "url": "https://israel4free.com/",
            "inLanguage": ["en", "he"],
            "publisher": { "@id": "https://israel4free.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
